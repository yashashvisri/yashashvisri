<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Yashashvi Srivastava, AI Engineer · Python / Agentic AI · Kanpur, India">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#141c2c" stroke-width="1"/>
    </pattern>
    <radialGradient id="warm" cx="0.78" cy="0.42" r="0.4">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="0.45" stop-color="#F97316" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
      .label { font-size: 12px; letter-spacing: 3px; fill: #7f9cc9; }
      .hello { font-size: 13px; letter-spacing: 4px; fill: #F97316; }
      .name { font-size: 64px; font-weight: 700; fill: #E8EEF8; }
      .sub { font-size: 20px; fill: #F3F4F6; }
      .loc { font-size: 13px; fill: #8b9bb4; }
      .val { font-size: 20px; fill: #F3F4F6; }
      .in { opacity: 0; animation: rise .9s ease-out forwards; }
      .a1 { animation-delay: .1s; } .a2 { animation-delay: .35s; } .a3 { animation-delay: .6s; } .a4 { animation-delay: .85s; } .a5 { animation-delay: 1.1s; }
      .cursor { fill: #F97316; animation: blink 1s steps(1) infinite; }
      .spin  { transform-origin: 780px 250px; animation: spin 26s linear infinite; }
      .spinr { transform-origin: 780px 250px; animation: spin 18s linear infinite reverse; }
      .edge { stroke: #3a3550; stroke-width: 1.2; fill: none; }
      .flow { stroke: #FDBA74; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 8 220; animation: flow 2.8s linear infinite; }
      .f2 { animation-delay: -.9s; stroke: #93C5FD; } .f3 { animation-delay: -1.8s; }
      .node { fill: #0b1220; stroke-width: 2; animation: pulse 2.6s ease-in-out infinite; }
      .n1 { animation-delay: .3s; } .n2 { animation-delay: .9s; } .n3 { animation-delay: 1.5s; } .n4 { animation-delay: 2.1s; }
      .dot { fill: #F97316; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes flow { from { stroke-dashoffset: 228; } to { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="598" rx="22" fill="#070b14" stroke="#3b2a24" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="598" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="598" rx="22" fill="url(#warm)"/>

  <text class="mono label" x="44" y="62">PROFILE / AI ENGINEER</text>
  <text class="mono label" x="956" y="62" text-anchor="end" fill="#93C5FD">@yashashvisri</text>

  <!-- left text -->
  <text class="mono hello in a1" x="44" y="146">HELLO, WORLD. I'M</text>
  <text class="mono name in a2" x="40" y="226">Yashashvi</text>
  <text class="mono name in a3" x="40" y="304">Srivastava<tspan class="cursor">_</tspan></text>
  <text class="mono sub in a4" x="44" y="378">Python / Agentic AI</text>
  <text class="mono loc in a5" x="44" y="408">Kanpur, India</text>

  <!-- right: agent graph orbit -->
  <circle cx="780" cy="250" r="168" fill="none" stroke="#1f2638" stroke-width="1"/>
  <g class="spin">
    <path d="M780 82 A168 168 0 0 1 940 200" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <path d="M780 418 A168 168 0 0 1 616 290" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </g>
  <g class="spinr">
    <circle cx="780" cy="250" r="140" fill="none" stroke="#2a3350" stroke-width="1.2" stroke-dasharray="3 9"/>
    <circle cx="920" cy="250" r="4" class="dot"/>
    <circle cx="640" cy="250" r="3" fill="#93C5FD"/>
  </g>

  <circle cx="780" cy="250" r="46" fill="url(#core)"/>
  <circle cx="780" cy="250" r="14" fill="#0b1220" stroke="#FDBA74" stroke-width="2"/>

  <path class="edge" d="M780 250 L700 170 M780 250 L870 175 M780 250 L870 330 M780 250 L695 330 M700 170 L870 175 M695 330 L870 330"/>
  <path class="flow" d="M780 250 L700 170"/>
  <path class="flow f2" d="M780 250 L870 175"/>
  <path class="flow f3" d="M780 250 L870 330"/>
  <path class="flow f2" d="M780 250 L695 330"/>

  <circle class="node n1" cx="700" cy="170" r="9" stroke="#93C5FD"/>
  <circle class="node n2" cx="870" cy="175" r="9" stroke="#F97316"/>
  <circle class="node n3" cx="870" cy="330" r="9" stroke="#a78bfa"/>
  <circle class="node n4" cx="695" cy="330" r="9" stroke="#FDBA74"/>

  <g class="mono" font-size="11" letter-spacing="2" fill="#6b7d99" text-anchor="middle">
    <text x="700" y="148">PLAN</text>
    <text x="870" y="153">TOOLS</text>
    <text x="870" y="360">MEMORY</text>
    <text x="695" y="360">ACT</text>
  </g>

  <!-- divider + facts row -->
  <line x1="44" y1="470" x2="956" y2="470" stroke="#1d2536" stroke-width="1.5"/>
  <g class="mono">
    <text class="label" x="44" y="512">ROLE</text>
    <text class="val" x="44" y="548">AI Engineer</text>
    <circle class="dot" cx="236" cy="508" r="3.5"/>

    <text class="label" x="276" y="512">COMPANY</text>
    <text class="val" x="276" y="548">Tevrix AI</text>
    <circle class="dot" cx="468" cy="508" r="3.5"/>

    <text class="label" x="508" y="512">FOCUS</text>
    <text class="val" x="508" y="548">Agentic AI</text>
    <circle class="dot" cx="700" cy="508" r="3.5"/>

    <text class="label" x="740" y="512">BASE</text>
    <text class="val" x="740" y="548">Kanpur, India</text>
    <circle class="dot" cx="952" cy="508" r="3.5"/>
  </g>
</svg>
